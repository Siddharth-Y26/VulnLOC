[project]
name = "vulnloc"
version = "0.1.0"
description = "Explainable Hybrid LLM-GNN Framework for Line-Level Software Vulnerability Detection and Localization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Siddharth Yadav" },
    { name = "Sujal Sanjay Chhajed" },
    { name = "Ayush Shukla" },
]

dependencies = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "networkx>=3.2",
    "tree-sitter>=0.21",
    # Grammars are separate wheels; the core library ships no languages (ADR-002 §D2.1).
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mlflow>=2.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "datasets>=2.18",
]

[project.optional-dependencies]
data = [
    # Big-Vul (LineVul release) and DiverseVul are distributed via Google Drive, which
    # needs the confirm-token dance that plain HTTP clients cannot do (ADR-001).
    "gdown>=5.1",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.9",
    # Real stubs rather than ignore_missing_imports: the data layer is pandas-heavy and
    # silencing it would forfeit type checking exactly where the schema bugs live.
    "pandas-stubs>=2.2",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    # FastAPI's TestClient is built on it; the serving tests drive the app in-process.
    "httpx>=0.27",
]
tracking = [
    "wandb>=0.16",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The demo page the serving app returns at `/`; a wheel install must carry it.
vulnloc = ["serving/static/*.html"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D"]
ignore = [
    "E203",
    "D203",  # incompatible with D211 (no blank line before class docstring)
    "D213",  # incompatible with D212 (summary on the first line)
    "D105",  # dunder behaviour is documented on the class, not per magic method
    "D107",  # __init__ arguments are documented in the class docstring (Google style)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["vulnloc"]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; module docstrings are still required
# so that a failing test file explains what contract it guards.
"tests/**" = ["D103", "D102"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["vulnloc.models.*", "vulnloc.representation.*"]
strict = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
    "hydra.*",
    "mlflow.*",
    "torch_geometric.*",
    "transformers.*",
    "tree_sitter.*",
    "tree_sitter_c.*",
    "tree_sitter_cpp.*",
    "networkx.*",
    "datasets.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test bodies are assertions, not an API surface.
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--cov=vulnloc --cov-report=term-missing --cov-report=xml --strict-markers"
markers = [
    "slow: tests that take more than a few seconds (deselect with '-m \"not slow\"')",
]
filterwarnings = ["error::DeprecationWarning:vulnloc.*"]

[tool.coverage.run]
source = ["src/vulnloc"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# --- Layer enforcement (Architecture.md §3) -----------------------------------
# Imports flow strictly downward: L6 -> L5 -> L4 -> L3 -> L2 -> L1 -> L0 -> utils.
# `lint-imports` runs in `make lint`, in pre-commit, and in CI.
[tool.importlinter]
root_package = "vulnloc"

[[tool.importlinter.contracts]]
name = "L6 -> L5 -> L4 -> L3 -> L2 -> L1 -> L0 layering"
type = "layers"
layers = [
    "vulnloc.serving",
    "vulnloc.explanation",
    "vulnloc.evaluation",
    "vulnloc.training",
    "vulnloc.models",
    "vulnloc.representation",
    "vulnloc.data",
]

[[tool.importlinter.contracts]]
name = "utils is a leaf: it depends on no other layer"
type = "forbidden"
source_modules = ["vulnloc.utils"]
forbidden_modules = [
    "vulnloc.data",
    "vulnloc.representation",
    "vulnloc.models",
    "vulnloc.training",
    "vulnloc.evaluation",
    "vulnloc.explanation",
    "vulnloc.serving",
]

[[tool.importlinter.contracts]]
name = "serving never imports training (Architecture.md §3)"
type = "forbidden"
source_modules = ["vulnloc.serving"]
forbidden_modules = ["vulnloc.training"]
