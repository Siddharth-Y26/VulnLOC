          llm_only:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_llm_only.json
            expect: {fusion_kind: llm_only}
          gnn_only:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_gnn_only.json
            expect: {fusion_kind: gnn_only}
        comparisons:
          - {first: cross_attention, second: llm_only, expects: first_higher}
          - {first: cross_attention, second: gnn_only, expects: first_higher}

      - key: a2_frozen_as_shipped
        title: Frozen encoder, text as shipped — the A1 screen (ADR-009)
        store: laptop_1
        encoder: frozen
        text: as_shipped
        status: run
        memory: "§1.21, §1.25"
        note: >-
          Frozen `llm_only` does not read the tell and every arm with a structural branch
          does (`Memory.md` §1.25), so the lead of a fused arm over `llm_only` in this
