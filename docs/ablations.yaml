# The ablation catalogue — which logged runs answer which claim (Phase 8).
#
# `ResearchPlan.md` §5 names ten ablations, each testing one claim. This file says, for
# each, which seed reports hold its runs, under which conditions they were made, and which
# difference would count as the claim holding. `scripts/make_ablation_tables.py` renders
# it into `artifacts/phase8/ablations.md`; no number is written here, and none may be.
#
# What the script checks against this file before it writes anything:
#   * every run of an arm logged the parameters the arm and its table declare — a table
#     marked `text: stripped` whose runs trained with comments is refused, not rendered;
#   * every report was selected on `val` — ablations are validation-only
#     (`docs/EvaluationProtocol.md` §9);
#   * a table marked `status: run` has all its reports, and one marked `pending` has none.
#
# A table is ONE comparison group under ONE set of conditions. Arms measured on different
# text, with a different encoder regime or on a different machine never share a table
# (`Memory.md` §7 #49, #61).
#
# `expects` on a comparison is the direction the claim predicts for Top-5:
#   first_higher — the claim holds if `first` beats `second`;
#   none         — the plan asks which is better, and predicts nothing.

schema: 1

stores:
  laptop_1:
    label: "this laptop (RTX 3050 Ti Laptop, 4 GiB, torch 2.13.0)"
    mlflow_db: ./artifacts/mlflow.db
  machine_2:
    label: "machine 2 (RTX 4050 Laptop, 6 GB, torch 2.14.1) — never pooled with this laptop's runs"
    mlflow_db: ./artifacts/machine2/Sujal_20261005-224401/mlflow_Sujal.db

ablations:
  - id: A1
    name: Fusion strategy
    claim: >-
      "Cross-attention-based fusion" is the novelty: deep interaction between the two
      branches beats simple combination (RQ2, contribution C2).
    tables:
      - key: a1_finetuned_stripped
        title: Fine-tuned encoder, comment-stripped text — the models of record
        store: laptop_1
        encoder: fine_tuned
        text: stripped
        status: run
        memory: "§1.28"
        reference: cross_attention
        arms:
          cross_attention:
            seed_report: ./artifacts/adr010/seed_report_fused_finetuned_stripped_cross_attention.json
            expect: {fusion_kind: cross_attention}
          concat:
            seed_report: ./artifacts/adr010/seed_report_fused_finetuned_stripped_concat.json
            expect: {fusion_kind: concat}
          llm_only:
            seed_report: ./artifacts/adr010/seed_report_fused_finetuned_stripped_llm_only.json
            expect: {fusion_kind: llm_only}
        comparisons:
          - {first: cross_attention, second: concat, expects: first_higher}
          - {first: cross_attention, second: llm_only, expects: first_higher}
          - {first: concat, second: llm_only, expects: none}

      - key: a1_frozen_stripped
        title: Frozen encoder, comment-stripped text — the screen retrained without the tell
        store: laptop_1
        encoder: frozen
        text: stripped
        status: run
        memory: "§1.32 (queue groups a1rcheck / a1r, 2026-10-10)"
        reference: cross_attention
        arms:
          cross_attention:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_cross_attention.json
            expect: {fusion_kind: cross_attention}
          concat:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_concat.json
            expect: {fusion_kind: concat}
          sum:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_sum.json
            expect: {fusion_kind: sum}
          gated:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_gated.json
            expect: {fusion_kind: gated}
          llm_only:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_llm_only.json
            expect: {fusion_kind: llm_only}
          gnn_only:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_gnn_only.json
            expect: {fusion_kind: gnn_only}
        comparisons:
          - {first: cross_attention, second: concat, expects: first_higher}
          - {first: cross_attention, second: sum, expects: first_higher}
          - {first: cross_attention, second: gated, expects: first_higher}

      - key: a1_frozen_stripped_replication
        title: Frozen encoder, comment-stripped text — the same screen on seeds 3, 4 and 5 alone
        store: laptop_1
        encoder: frozen
        text: stripped
        status: pending
        memory: "§1.32 (queue group a1rep; the plan was written before the runs)"
        note: >-
          A replication: three seeds the table above never saw, the same constants and the
          same semantic cache. `gnn_only` was not run again. What this table is read for was
          fixed in `Memory.md` §1.32 before its first run started.
        reference: cross_attention
        arms:
          cross_attention:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_replication_cross_attention.json
            expect: {fusion_kind: cross_attention}
          concat:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_replication_concat.json
            expect: {fusion_kind: concat}
          sum:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_replication_sum.json
            expect: {fusion_kind: sum}
          gated:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_replication_gated.json
            expect: {fusion_kind: gated}
          llm_only:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_replication_llm_only.json
            expect: {fusion_kind: llm_only}
        comparisons:
          - {first: cross_attention, second: concat, expects: first_higher}
          - {first: cross_attention, second: sum, expects: first_higher}
          - {first: cross_attention, second: gated, expects: first_higher}
          - {first: cross_attention, second: llm_only, expects: first_higher}

      - key: a1_frozen_stripped_six_seeds
        title: Frozen encoder, comment-stripped text — both sets of seeds together (42, 1, 2, 3, 4, 5)
        store: laptop_1
        encoder: frozen
        text: stripped
        status: pending
        memory: "§1.32 (queue groups a1r and a1rep)"
        note: >-
          The two tables above pooled. Not a third measurement: three of its six seeds are
          the ones whose result prompted the other three.
        reference: cross_attention
        arms:
          cross_attention:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_six_seeds_cross_attention.json
            expect: {fusion_kind: cross_attention}
          concat:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_six_seeds_concat.json
            expect: {fusion_kind: concat}
          sum:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_six_seeds_sum.json
            expect: {fusion_kind: sum}
          gated:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_six_seeds_gated.json
            expect: {fusion_kind: gated}
          llm_only:
            seed_report: ./artifacts/adr010/seed_report_fused_frozen_stripped_six_seeds_llm_only.json
            expect: {fusion_kind: llm_only}
        comparisons:
          - {first: cross_attention, second: concat, expects: first_higher}
          - {first: cross_attention, second: sum, expects: first_higher}
          - {first: cross_attention, second: gated, expects: first_higher}
          - {first: cross_attention, second: llm_only, expects: first_higher}

      - key: a1_finetuned_as_shipped
        title: Fine-tuned encoder, text as shipped (ADR-009 D9.7)
        store: laptop_1
        encoder: fine_tuned
        text: as_shipped
        status: run
        memory: "§1.22"
        reference: cross_attention
        arms:
          cross_attention:
            seed_report: ./artifacts/phase5/seed_report_fused_finetuned_cross_attention.json
            expect: {fusion_kind: cross_attention}
          concat:
            seed_report: ./artifacts/phase5/seed_report_fused_finetuned_concat.json
            expect: {fusion_kind: concat}
          llm_only:
            seed_report: ./artifacts/phase5/seed_report_fused_finetuned_llm_only.json
            expect: {fusion_kind: llm_only}
        comparisons:
          - {first: cross_attention, second: concat, expects: first_higher}
          - {first: cross_attention, second: llm_only, expects: first_higher}
          - {first: concat, second: llm_only, expects: none}

      - key: a1_frozen_as_shipped
        title: Frozen encoder, text as shipped — the A1 screen (ADR-009)
        store: laptop_1
        encoder: frozen
        text: as_shipped
        status: run
        memory: "§1.21"
        reference: cross_attention
        arms:
          cross_attention:
            seed_report: ./artifacts/phase5/seed_report_fused_cross_attention.json
            expect: {fusion_kind: cross_attention}
          concat:
            seed_report: ./artifacts/phase5/seed_report_fused_concat.json
            expect: {fusion_kind: concat}
          sum:
            seed_report: ./artifacts/phase5/seed_report_fused_sum.json
            expect: {fusion_kind: sum}
          gated:
            seed_report: ./artifacts/phase5/seed_report_fused_gated.json
            expect: {fusion_kind: gated}
          llm_only:
            seed_report: ./artifacts/phase5/seed_report_fused_llm_only.json
            expect: {fusion_kind: llm_only}
          gnn_only:
            seed_report: ./artifacts/phase5/seed_report_fused_gnn_only.json
            expect: {fusion_kind: gnn_only}
        comparisons:
          - {first: cross_attention, second: concat, expects: first_higher}
          - {first: cross_attention, second: sum, expects: first_higher}
          - {first: cross_attention, second: gated, expects: first_higher}

  - id: A2
    name: Branch removal
    claim: Both modalities contribute — the full model beats either branch alone (RQ1).
    note: >-
      The single-branch arms here run through the fused scaffold (ADR-008 §D8.6), so a
      difference is about the branch, not about the scaffold. The standalone Phase 3 and
      Phase 4 baselines are a different scaffold and are not in these tables.
    tables:
      - key: a2_finetuned_stripped
        title: Fine-tuned encoder, comment-stripped text — the models of record
        store: laptop_1
        encoder: fine_tuned
        text: stripped
        status: run
        memory: "§1.28"
        reference: cross_attention
        arms:
          cross_attention:
            seed_report: ./artifacts/adr010/seed_report_fused_finetuned_stripped_cross_attention.json
            expect: {fusion_kind: cross_attention}
          llm_only:
            seed_report: ./artifacts/adr010/seed_report_fused_finetuned_stripped_llm_only.json
            expect: {fusion_kind: llm_only}
        comparisons:
          - {first: cross_attention, second: llm_only, expects: first_higher}

      - key: a2_frozen_stripped
        title: Frozen encoder, comment-stripped text — the screen retrained without the tell
        store: laptop_1
        encoder: frozen
        text: stripped
        status: run
