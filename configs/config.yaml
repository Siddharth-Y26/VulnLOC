# Root Hydra composition (Architecture.md §5, §8).
# `data` (Phase 1), `graph` (Phase 2), `llm` and `head` (Phase 3) are wired to real
# entrypoints. The remaining groups (gnn, fusion, explainer) are empty-but-composable stubs —
# see Phases.md, each is filled in by its owning phase. Do not add one to `defaults`
# until that phase lands.
defaults:
  - data: default
  - graph: default
  - llm: default
  - head: default
  - train: default
  - _self_

seed: 42

# L1 source normalization. `true` strips leading and trailing whitespace from every
# source line before anything — tokenizer or graph builder — sees it.
#
# This is a LABEL LEAK fix, not cosmetics (ADR-006). The LineVul release of Big-Vul
# strips indentation from `processed_func` but re-inserts flagged lines verbatim from
# `flaw_line`, so "does this line start with a space?" recovers the line label at
# precision 1.0000 with zero false positives on all four partitions. Run `1843412a…`
# learned exactly that rule and nothing else.
#
# The transform preserves the line count exactly, so line labels stay attached.
# `false` reproduces every pre-ADR-006 number and must never be used for a reported one.
representation:
  normalize_whitespace: true

# `auto` uses CUDA when it is genuinely usable and warns loudly on CPU fallback.
# Set `cuda` to make a missing GPU a hard failure, `cpu` to force CPU.
device:
  kind: auto
  index: 0

mlflow:
  # SQLite, not the legacy `file:./mlruns` store: MLflow 3 put the filesystem backend
  # into maintenance mode and refuses it by default. See ADR-000 §D0.7.
  # Paths are relative to the launch directory; `hydra.job.chdir` stays False.
  tracking_uri: "sqlite:///artifacts/mlflow.db"
  experiment_name: vulnloc
  artifact_location: "./artifacts/mlartifacts"

logging:
  level: INFO
  json_to_file: true
  log_dir: "./artifacts/logs"
